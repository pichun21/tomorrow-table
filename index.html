function androidRemind(items,tm,tb){window.__andItems=items.map(x=>x.id);modal('🔔 加到 Google 日曆',`<p class="sub" style="margin:-6px 0 10px;line-height:1.7">Android 一次只能加一筆。點每一項的「加入」，在 Google 日曆按「儲存」，再回到這裡點下一項。</p><div class="remind-list">${items.map(x=>`<div class="remind-row"><span class="remind-d">${x.date===today()?'今天':x.date===addDays(today(),1)?'明天':shortDate(x.date)}</span><span class="remind-t">${kicon(x.kind)} ${esc(x.title)}</span><a class="action small and-add" href="${gcalUrl(x,tm,tb)}" target="_blank" rel="noopener" data-and-id="${x.id}">加入</a></div>`).join('')}</div><p class="muted-note">Google 日曆會用你預設的通知時間提醒。用三星日曆等其他 App 的話，可以改按「下載檔案」，一次全部匯入。</p>`,`<button class="action secondary" data-close>完成</button><button class="action outline" data-and-ics>下載檔案</button>`)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-and-id],[data-and-ics]');if(!a)return;if(a.dataset.andIcs!==undefined){e.preventDefault();e.stopImmediatePropagation();(window.__andItems||[]).forEach(id=>{const x=db.prep.find(p=>p.id===id);if(x)x.reminded=true});save();icsServer?postIcs(window.__ics):openIcs0(window.__ics);return}const x=db.prep.find(p=>p.id===a.dataset.andId);if(x){x.reminded=true;save()}a.textContent='已加入 ✓';a.classList.add('secondary')},true);
const isIOS=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let icsServer=null;function checkIcsServer(){if(icsServer!==null||!/^https?:/.test(location.protocol))return Promise.resolve(icsServer=icsServer||false);return fetch('/ics',{cache:'no-store'}).then(r=>icsServer=!!r.headers.get('x-tn-ics')).catch(()=>icsServer=false)}
function postIcs(txt){const f=document.createElement('form');f.method='POST';f.action='/ics';f.style.display='none';const t=document.createElement('textarea');t.name='ics';t.value=txt;f.appendChild(t);document.body.appendChild(f);f.submit();setTimeout(()=>f.remove(),1000)}
function openIcs0(txt){const url='data:text/calendar;charset=utf-8,'+encodeURIComponent(txt);if(isIOS()){try{window.location.href=url;return}catch{}}const blob=new Blob([txt],{type:'text/calendar'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='番茄手札提醒.ics';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function shareIcs(){const txt=window.__ics;if(!txt)return;const f=new File([txt],'番茄手札提醒.ics',{type:'text/calendar'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'番茄手札提醒'});close();return}}catch(err){if(err&&err.name==='AbortError')return}const blob=new Blob([txt],{type:'text/calendar'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='番茄手札提醒.ics';document.body.appendChild(a);a.click();a.remove();close()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-remind],[data-remind-go],[data-ics-share]');if(!b)return;e.stopImmediatePropagation();if(b.dataset.icsShare!==undefined)return shareIcs();if(b.dataset.remindGo!==undefined)remindGo();else remindModal()},true);

document.addEventListener('click',e=>{const b=e.target.closest('[data-wipe],[data-wipe-go]');if(!b)return;e.stopImmediatePropagation();
if(b.dataset.wipe!==undefined){modal('清空資料，重新開始？',`<p class="sub" style="font-size:14.5px;line-height:1.8">會刪掉目前所有的菜色、菜單、備料和冷凍庫備註，回到全新的空白手札。<br><br>建議先按「匯出 JSON 備份」留一份。清空後 5 秒內還可以按「復原」。</p>`,`<button class="action secondary" data-close>取消</button><button class="action danger-button" data-wipe-go>確認清空</button>`);return}
close();withUndo('已清空，從空白手札開始',()=>{const keep={guideSeen:true,presetsCleaned:true,lastExport:db.lastExport,remindTime:db.remindTime,remindBuy:db.remindBuy,swipeHintSeen:db.swipeHintSeen};db={...blankDb(),...keep}});tab='home';render()},true);
checkIcsServer();save();render();if(shouldEnter())runEntry(()=>{if(!db.guideSeen)setTimeout(tourStart,250)});else if(!db.guideSeen)setTimeout(tourStart,700);if(cleanedPresets)setTimeout(()=>toast(`已移除 ${cleanedPresets} 道之前自動加入、沒用過的菜`),400);})();
</script></body></html>
