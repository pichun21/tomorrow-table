function runEntry(after){const t=addDays(today(),1),names=allOf(t).map(x=>byId(x.dishId)?.name).filter(Boolean);const d=new Date(today()+'T12:00:00');
const wrap=document.createElement('div');wrap.className='entry tn-entry';wrap.innerHTML=`<div class="tn-book"><div class="tn-flip"><div class="nb-page"><div class="nb-page-in"><span class="nb-hand">${d.getMonth()+1}月${d.getDate()}日・星期${'日一二三四五六'[d.getDay()]}</span><p>今天也要<br>好好吃飯 ♡</p><div class="nb-tmr"><b>明天的菜</b>${names.length?names.slice(0,4).map(n=>`<span>${esc(n)}</span>`).join(''):'<span class="nb-empty">還沒排，翻開來寫寫看</span>'}</div></div></div><div class="tn-cover"><div class="tn-front"><div class="tn-live"><span class="tn-en">Tomato Notes</span><i></i><small>${d.getFullYear()} · ${d.getMonth()+1} · ${d.getDate()}</small></div></div><div class="tn-back"></div></div></div></div><button class="entry-skip" type="button">略過 ›</button>`;
document.body.appendChild(wrap);document.body.classList.add('entry-lock');
const lay=()=>{const VW=innerWidth,vh=innerHeight,vw=Math.min(VW,vh*.62),sc=Math.max(vw/SC.w,vh/SC.h),ox=(VW-SC.w*sc)/2,oy=(vh-SC.h*sc)/2;wrap.style.setProperty('--colw',vw+'px');const st=wrap.style;st.setProperty('--bgw',SC.w*sc+'px');st.setProperty('--bgx',ox+'px');st.setProperty('--bgy',oy+'px');st.setProperty('--bl',ox+SC.bx*sc+'px');st.setProperty('--bt',oy+SC.by*sc+'px');st.setProperty('--bw',SC.bw*sc+'px');st.setProperty('--bh',SC.bh*sc+'px')};
wrap.style.setProperty('--scene',`url(${ENTRY_SCENE})`);lay();addEventListener('resize',lay);
let done=false,started=false;const finish=()=>{if(done)return;done=true;removeEventListener('resize',lay);try{localStorage.setItem(entryKey(),today())}catch{}wrap.classList.add('s-out');document.body.classList.remove('entry-lock');setTimeout(()=>{wrap.remove();after&&after()},380)};
const go=()=>{if(started)return;started=true;buzz(10);if(RM){finish();return}const cv=wrap.querySelector('.tn-cover');wrap.classList.add('s-book');try{cv.animate([{transform:'translateZ(2px) rotateY(0deg)'},{transform:'translateZ(2px) rotateY(-28deg)',offset:.35},{transform:'translateZ(2px) rotateY(-172deg)'}],{duration:1000,easing:'cubic-bezier(.45,.05,.3,1)',fill:'forwards'})}catch{cv.style.transform='translateZ(2px) rotateY(-172deg)'}setTimeout(finish,names.length?2300:1900)};
wrap.addEventListener('click',e=>{if(e.target.closest('.entry-skip')){finish();return}if(started){finish();return}go()})}

// ===== 提醒：匯出到行事曆 =====
function remindItems(){const T=today();return db.prep.filter(x=>!x.done&&x.date>=T).sort((a,b)=>a.date.localeCompare(b.date))}
function remindModal(){const list=remindItems(),tm=db.remindTime||'20:30',tb=db.remindBuy||'09:00';
modal('🔔 到時候提醒我',list.length?`<p class="sub" style="margin:-6px 0 10px">會把下面這些事加進 iPhone 的「行事曆」，時間到就跳通知。</p>
<div class="remind-times"><label class="field">退冰、切備等<input type="time" id="rmTime" value="${tm}"></label><label class="field">採買<input type="time" id="rmBuy" value="${tb}"></label></div>
<div class="remind-list">${list.map(x=>`<label class="remind-row"><input type="checkbox" class="rm-ck" value="${x.id}" ${x.reminded?'':'checked'}><span class="remind-d">${x.date===today()?'今天':x.date===addDays(today(),1)?'明天':shortDate(x.date)}</span><span class="remind-t">${kicon(x.kind)} ${esc(x.title)}</span>${x.reminded?'<span class="remind-done">已加過</span>':''}</label>`).join('')}</div>
<p class="muted-note">已經加過的預設不勾，避免行事曆出現重複的提醒。</p>`:'<div class="empty">目前沒有要提醒的備料</div>',`<button class="action secondary" data-close>取消</button>${list.length?'<button class="action" data-remind-go>加到行事曆</button>':''}`)}
function icsText(items,tm,tb){const pad2=n=>String(n).padStart(2,'0'),now=new Date(),stamp=now.getUTCFullYear()+pad2(now.getUTCMonth()+1)+pad2(now.getUTCDate())+'T'+pad2(now.getUTCHours())+pad2(now.getUTCMinutes())+'00Z';const esc2=t=>String(t).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
const ev=items.map(x=>{const t=(x.kind==='採買'?tb:tm).replace(':','');const d=x.date.replace(/-/g,'');return ['BEGIN:VEVENT','UID:'+x.id+'@tomato-notes','DTSTAMP:'+stamp,'DTSTART:'+d+'T'+t+'00','DURATION:PT15M','SUMMARY:'+esc2(kicon(x.kind)+' '+x.title),'DESCRIPTION:'+esc2((x.from?'給「'+x.from+'」用。':'')+'來自番茄手札'),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc2(x.title),'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n')});
return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//needtodeco//Tomato Notes//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH',...ev,'END:VCALENDAR'].join('\r\n')}
function remindGo(){const ids=[...document.querySelectorAll('.rm-ck:checked')].map(x=>x.value);if(!ids.length){toast('請至少勾一項');return}const tm=el('rmTime').value||'20:30',tb=el('rmBuy').value||'09:00';db.remindTime=tm;db.remindBuy=tb;const items=db.prep.filter(x=>ids.includes(x.id));const txt=icsText(items,tm,tb);
const url='data:text/calendar;charset=utf-8,'+encodeURIComponent(txt);const a=document.createElement('a');a.href=url;a.download='番茄手札提醒.ics';document.body.appendChild(a);a.click();a.remove();
items.forEach(x=>x.reminded=true);save();close();render();toast(`已產生 ${items.length} 個提醒，請在跳出的畫面按「加入全部」`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-remind],[data-remind-go]');if(!b)return;e.stopImmediatePropagation();if(b.dataset.remindGo!==undefined)remindGo();else remindModal()},true);

document.addEventListener('click',e=>{const b=e.target.closest('[data-wipe],[data-wipe-go]');if(!b)return;e.stopImmediatePropagation();
if(b.dataset.wipe!==undefined){modal('清空資料，重新開始？',`<p class="sub" style="font-size:14.5px;line-height:1.8">會刪掉目前所有的菜色、菜單、備料和冷凍庫備註，回到全新的空白手札。<br><br>建議先按「匯出 JSON 備份」留一份。清空後 5 秒內還可以按「復原」。</p>`,`<button class="action secondary" data-close>取消</button><button class="action danger-button" data-wipe-go>確認清空</button>`);return}
close();withUndo('已清空，從空白手札開始',()=>{const keep={guideSeen:true,presetsCleaned:true,lastExport:db.lastExport,remindTime:db.remindTime,remindBuy:db.remindBuy,swipeHintSeen:db.swipeHintSeen};db={...blankDb(),...keep}});tab='home';render()},true);
save();render();if(shouldEnter())runEntry(()=>{if(!db.guideSeen)setTimeout(tourStart,250)});else if(!db.guideSeen)setTimeout(tourStart,700);if(cleanedPresets)setTimeout(()=>toast(`已移除 ${cleanedPresets} 道之前自動加入、沒用過的菜`),400);})();
</script></body></html>
