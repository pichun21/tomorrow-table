/* ===== 互動 ===== */
.action,.tick,.chip,.meal-tab,.quick,.daytile,.circlebtn,.emoji-opt,.plain-icon,.linkbtn{transition:transform .12s ease,background-color .2s,border-color .2s,color .2s}
.action:active,.chip:active,.meal-tab:active,.quick:active,.daytile:active,.circlebtn:active,.emoji-opt:active{transform:scale(.95)}
.tick:active{transform:scale(.85)}
.page.active{animation:pageIn .26s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal-bg{animation:fadeIn .2s ease}.modal{animation:sheetUp .28s cubic-bezier(.2,.9,.25,1)}
.modal-bg.closing{animation:fadeOut .2s ease forwards;pointer-events:none}.modal-bg.closing .modal{animation:sheetDown .2s ease forwards}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}@keyframes sheetUp{from{transform:translateY(40%);opacity:.6}}@keyframes sheetDown{to{transform:translateY(30%);opacity:0}}
.modal::before{content:'';display:block;width:40px;height:4px;border-radius:4px;background:#e6d2be;margin:-12px auto 12px}
.toast{animation:toastIn .25s cubic-bezier(.2,.9,.25,1)}@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
.toast-undo{display:flex;align-items:center;gap:14px;padding:9px 10px 9px 18px;max-width:calc(100% - 32px)}
.toast-undo button{background:#fff;color:var(--sage);border:0;border-radius:999px;padding:5px 12px;font-weight:800;font-size:12.5px;white-space:nowrap}
.tick.tick-pop{animation:tickPop .35s cubic-bezier(.3,1.6,.5,1)}@keyframes tickPop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.ticking .prep-row-title,.ticking .entry-title{color:#c4b2a4;text-decoration:line-through;transition:color .25s}
.leaving{transition:height .24s ease,opacity .2s ease,transform .24s ease,padding .24s ease;opacity:0;transform:translateX(-30px);overflow:hidden;padding-top:0!important;padding-bottom:0!important}
.pop-in{animation:popIn .45s cubic-bezier(.2,1.2,.4,1)}@keyframes popIn{0%{opacity:0;transform:translateY(-6px) scale(.97);background:#fff1ee}60%{background:#fff1ee}100%{opacity:1;transform:none;background:transparent}}
.bump{animation:bump .3s ease}@keyframes bump{50%{transform:scale(1.12)}}
.prep-row,#menus .check-row{position:relative;touch-action:pan-y;background:var(--paper);transition:transform .22s ease,background-color .2s}
.prep-row.swiping,#menus .check-row.swiping{transition:none}
.prep-row::before,#menus .check-row::before,.prep-row::after,#menus .check-row::after{position:absolute;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:800;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.prep-row::before,#menus .check-row::before{content:'✓ 完成';right:calc(100% + 14px);color:#5f8a46}
.prep-row::after,#menus .check-row::after{content:'刪除';left:calc(100% + 14px);color:var(--sage)}
.swiping::before,.swiping::after{opacity:.45}
[data-sw="done"]{background:#f2f8ec}[data-sw="done"]::before{opacity:1}
[data-sw="del"]{background:#fff1ee}[data-sw="del"]::after{opacity:1}
.prep-day,#menus .card{overflow:hidden}
.burst{position:fixed;left:50%;bottom:120px;z-index:60;pointer-events:none}
.burst span{position:absolute;font-size:26px;animation:burst 1.1s cubic-bezier(.2,.8,.3,1) forwards;--a:calc(var(--i)*60deg)}
@keyframes burst{0%{transform:translate(-50%,0) scale(.4);opacity:1}100%{transform:translate(calc(-50% + cos(var(--a))*110px),calc(sin(var(--a))*-90px - 60px)) scale(1) rotate(30deg);opacity:0}}
.swipe-hint{text-align:center;font-size:11.5px;color:var(--muted);margin:-4px 0 10px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.ready{background:var(--paper);border:1px solid #efc1b9;border-radius:22px;padding:14px 16px 10px;margin-bottom:14px;box-shadow:0 8px 22px rgba(207,64,56,.07)}
.ready.is-ok{border-color:#cfe0bd;box-shadow:0 8px 22px rgba(95,138,70,.08)}
.ready-head h2{font-family:var(--serif);color:var(--sage);font-size:20px;letter-spacing:.06em;margin:0 0 6px}
.ready.is-ok .ready-head h2{color:#5f8a46}
.ready-line{display:grid;grid-template-columns:26px 86px 1fr;align-items:baseline;gap:6px;width:100%;background:none;border:0;border-top:1px dashed var(--line);padding:9px 0;text-align:left;color:var(--ink);font:inherit}
.ready-ic{font-size:17px}.ready-k{font-weight:700;font-size:13.5px;color:#7d5f52}.ready-v{font-size:14.5px;font-weight:600;line-height:1.5}.ready-v em{font-style:normal;color:var(--muted);font-weight:400}
.ready-done{border-top:1px dashed var(--line);padding:9px 0 4px;font-size:13.5px;color:#5f8a46}
.dish-preps{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 0 34px}
.dp{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:999px;background:#fbf4ec;border:1px solid #efdfcf;color:#7d5f52}
.dp small{font-size:10.5px;color:var(--muted);margin-left:2px}
.dp.is-done{opacity:.5;text-decoration:line-through}
.home-hero{margin:-4px -2px 14px;border-radius:20px;overflow:hidden;box-shadow:0 10px 26px rgba(150,95,60,.10)}.home-hero .new-hero-image{display:block;width:100%;height:auto;border-radius:20px!important;mix-blend-mode:normal}.home-hero{margin:0 -6px 12px;border-radius:0;overflow:visible;box-shadow:none;background:none}.home-hero .new-hero-image{border-radius:0!important;mix-blend-mode:normal;filter:drop-shadow(0 6px 10px rgba(150,95,60,.10))}
.guide-btn{margin-left:10px;width:30px;height:30px;border-radius:50%;border:1px solid #e3cdb9;background:#fff;color:var(--sage);font-family:var(--serif);font-weight:700;font-size:15px;flex:none;padding:0}
.hero-date{margin-left:auto}
#tour-root{position:fixed;inset:0;z-index:90}
.tour-block{position:fixed;inset:0}
.tour-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(45,28,22,.58);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;outline:2px solid rgba(255,255,255,.85);outline-offset:2px}
.tour-hole.none{left:50%;top:50%;width:0;height:0;outline:0}
.tour-tip{position:fixed;width:min(340px,calc(100vw - 32px));background:var(--paper);border-radius:20px;padding:16px 18px 14px;box-shadow:0 18px 40px rgba(45,28,22,.28);transition:top .3s cubic-bezier(.2,.8,.2,1),left .3s cubic-bezier(.2,.8,.2,1);animation:fadeIn .25s ease}
.tour-step{font-family:var(--script);font-style:italic;color:var(--gold);font-size:13px}
.tour-tip h3{font-family:var(--serif);color:var(--sage);font-size:18px;margin:2px 0 8px;letter-spacing:.05em}
.tour-tip p{margin:0;font-size:14px;line-height:1.75;color:var(--ink)}.tour-tip b{color:var(--sage)}
.tour-dots{display:flex;gap:5px;justify-content:center;margin:12px 0 10px}.tour-dots i{width:6px;height:6px;border-radius:50%;background:#ead6c3}.tour-dots i.on{background:var(--sage);width:16px;border-radius:6px}
.tour-btns{display:flex;gap:8px;align-items:center}.tour-btns .action{flex:none}.tour-btns .action:last-child{margin-left:0}
.tour-skip{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 4px;margin-right:auto}
.pot{width:38px!important;height:38px!important;border:0!important;background:none!important;padding:0}.pot img{width:38px;height:38px;display:block}</style><style id="dish-art-update">.dish-mini .emoji{display:inline-flex;align-items:center}.new-hero-image{border-radius:16px}</style><style id="daily-library-polish">.chip:focus-visible{outline:3px solid #cf4038;outline-offset:2px}
</style><style id="recipe-card-handbook-v4">.chips{gap:7px}.chip{border-radius:999px;min-height:34px}

document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;const r=e.target.closest('.prep-row,#menus .check-row');if(!r||e.target.closest('.tick'))return;sw={r,x:e.clientX,y:e.clientY,dx:0,on:false}},{passive:true});
document.addEventListener('pointermove',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(!sw.on){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)*1.4){sw.on=true;sw.r.classList.add('swiping')}else if(Math.abs(dy)>12){sw=null;return}else return}sw.dx=dx;sw.r.style.transform=`translateX(${Math.max(-140,Math.min(140,dx))}px)`;const st=dx>70?'done':dx<-70?'del':'';if(st!==sw.r.dataset.sw){sw.r.dataset.sw=st;if(st)buzz(8)}},{passive:true});
function endSwipe(){if(!sw)return;const {r,on,dx}=sw;sw=null;if(!on)return;r.classList.remove('swiping');r.style.transform='';delete r.dataset.sw;swClick=true;setTimeout(()=>swClick=false,60);if(Math.abs(dx)>70&&!db.swipeHintSeen){db.swipeHintSeen=true;save()}if(dx>70){swClick=false;r.querySelector('.tick')?.click();swClick=true;setTimeout(()=>swClick=false,60)}else if(dx<-70){swClick=false;r.querySelector('.plain-icon.danger')?.click();swClick=true;setTimeout(()=>swClick=false,60)}}
document.addEventListener('pointerup',endSwipe);document.addEventListener('pointercancel',()=>{if(sw){sw.r.classList.remove('swiping');sw.r.style.transform='';delete sw.r.dataset.sw;sw=null}});

// ===== 使用說明（導覽） =====
let tourI=-1,tourSteps=[];
function exDish(){const L=db.library;return L.find(d=>d.name==='佛手瓜雞湯'&&d.preps?.length)||L.find(d=>(d.preps||[]).filter(t=>t.item).length>1)||L.find(d=>d.preps?.length)||L[0]}
function exDish2(){const L=db.library,a=exDish();return L.find(d=>d.name==='高麗菜燴獅子頭'&&d!==a)||L.find(d=>d!==a&&d.preps?.length)||a}
function prepText(d){const o=Object.fromEntries(OFFSETS);return (d?.preps||[]).filter(t=>t.item).map(t=>`${o[t.offset]??''}${t.kind}${t.item}`).join('、')}
function buildTour(){const a=exDish(),b=exDish2(),an=esc(a?.name||'一道菜'),bn=esc(b?.name||'一道菜'),ap=esc(prepText(a)||'前一天退冰雞肉'),bp=esc(prepText(b)||'前一天退冰獅子頭');
return [
{title:'歡迎使用明日餐桌 🍅',html:'這個小工具只做三件事：<br><b>明天煮什麼</b>、<b>要先退冰什麼</b>、<b>要買什麼</b>。<br><br>接下來用你菜色裡的菜當例子，帶你看一遍，大約一分鐘。'},
{tab:'home',sel:'.ready',title:'每天晚上看這張就好',html:`明天要吃的菜、今晚要退冰的、還沒買的，都整理在這裡。<br><br>例如「${bn}」設定了「${bp}」，只要明天排了這道菜，今晚這裡就會提醒你。`},
{tab:'menus',sel:'.meal-tabs',title:'先選日期，再選哪一餐',html:'上方的 ‹ › 可以換日期，這裡切換早餐、午餐、晚餐。<br>平常只排晚餐也沒關係。'},
{tab:'menus',sel:'[data-add-to-menu]',title:'加菜：打字就好',html:'按「新增料理」，打菜名再按 Enter 就加進去了。<br>菜色裡沒有的菜會自動存起來，下次打幾個字就找得到。'},
{tab:'menus',sel:()=>{const rows=[...document.querySelectorAll('#menus .check-row')];const eid=entries(selected).find(x=>x.dishId===a?.id)?.id;return (eid&&document.querySelector(`[data-toggle-item="${eid}"]`)?.closest('.check-row'))||rows.find(x=>x.querySelector('.dish-preps'))||rows[0]},title:'菜名下面的小標籤',html:`例如「${an}」設定了「${ap}」，排進菜單後，菜名下面就會出現 🧊 退冰、🔪 切備這樣的小標籤，排菜時就知道要不要提前準備。<br>往右滑可以勾完成，往左滑可以從菜單移除。`},
{tab:'library',sel:()=>document.querySelector(`[data-edit-dish="${a?.id}"]`)||document.querySelector('.dish-row'),title:'設定一次，以後自動提醒',html:`點一道菜，就能設定「需要先準備什麼」。<br>例如「${an}」：<b>${ap}</b>。<br><br>之後每次把它排進菜單，提醒就會自動出現在對的日子。`},
{tab:'prep',sel:'.prep-day',title:'備料清單',html:'做完就打勾（往右滑也可以），勾掉的會先留著變灰，避免誤刪。<br>確定沒問題後，再按下方的「清除已完成」。'},
{tab:'prep',sel:'[data-new-prep]',title:'臨時要做、要買的事',html:'不屬於任何一道菜的，例如「買雞蛋」，從這裡新增。<br>選類型、填食材，再選「要吃的那天」和「什麼時候做」。'},
{tab:'prep',sel:'.fz-card',title:'冷凍庫隨手記',html:'排菜時常會忘記冷凍庫還有什麼，想到就在這裡記一筆，打字會自動儲存。'},
{tab:'home',sel:'#home [data-shop]',title:'去超市前按這個',html:'未來幾天要買的東西會合併成一張清單，邊買邊勾。<br>也可以「複製清單」貼到 LINE 給家人。'},
{tab:'home',sel:'#guideBtn',title:'想再看一次？',html:'隨時按右上角的「?」就能重看這份說明。<br><br>小提醒：資料只存在這支手機的瀏覽器裡，記得偶爾到首頁下方「匯出備份」。',last:true}]}
function tourShow(i){tourI=i;const st=tourSteps[i];if(!st)return tourEnd();if(st.tab&&tab!==st.tab){tab=st.tab;render();window.scrollTo(0,0)}
let root=el('tour-root');if(!root){root=document.createElement('div');root.id='tour-root';document.body.appendChild(root)}
const t=typeof st.sel==='function'?st.sel():st.sel?document.querySelector(st.sel):null;
root.innerHTML=`<div class="tour-block"></div><div class="tour-hole ${t?'':'none'}"></div><div class="tour-tip" role="dialog" aria-live="polite"><div class="tour-step">${i+1} / ${tourSteps.length}</div><h3>${st.title}</h3><p>${st.html}</p><div class="tour-dots">${tourSteps.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><div class="tour-btns"><button class="tour-skip" data-tour="end">${st.last?'':'略過'}</button>${i?'<button class="action secondary small" data-tour="prev">上一步</button>':''}<button class="action small" data-tour="${st.last?'end':'next'}">${st.last?'開始使用 ✓':'下一步'}</button></div></div>`;
if(t){t.scrollIntoView({block:'center'})}setTimeout(tourPlace,t?60:0)}
function tourPlace(){const root=el('tour-root');if(!root||tourI<0)return;const st=tourSteps[tourI],t=typeof st.sel==='function'?st.sel():st.sel?document.querySelector(st.sel):null,hole=root.querySelector('.tour-hole'),tip=root.querySelector('.tour-tip');const vw=innerWidth,vh=innerHeight;
if(!t){hole.style.cssText='';tip.style.left=Math.max(16,(vw-tip.offsetWidth)/2)+'px';tip.style.top=Math.max(16,(vh-tip.offsetHeight)/2)+'px';return}
const r=t.getBoundingClientRect(),pad=8;hole.style.left=(r.left-pad)+'px';hole.style.top=(r.top-pad)+'px';hole.style.width=(r.width+pad*2)+'px';hole.style.height=(r.height+pad*2)+'px';
const tw=tip.offsetWidth,th=tip.offsetHeight;let left=Math.min(vw-tw-16,Math.max(16,r.left+r.width/2-tw/2)),top=r.bottom+pad+12;if(top+th>vh-12)top=r.top-pad-12-th;if(top<12)top=Math.max(12,vh-th-12);tip.style.left=left+'px';tip.style.top=top+'px'}
function tourEnd(){tourI=-1;el('tour-root')?.remove();if(!db.guideSeen){db.guideSeen=true;save()}tab='home';render();window.scrollTo(0,0)}
function tourStart(){tourSteps=buildTour();close();tourShow(0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tour],[data-guide]');if(!b)return;e.stopImmediatePropagation();e.preventDefault();if(b.dataset.guide!==undefined)return tourStart();const v=b.dataset.tour;if(v==='next')tourShow(tourI+1);else if(v==='prev')tourShow(tourI-1);else tourEnd()},true);
addEventListener('resize',()=>tourPlace());addEventListener('scroll',()=>tourPlace(),{passive:true});
document.addEventListener('keydown',e=>{if(tourI<0)return;if(e.key==='Escape')tourEnd();if(e.key==='ArrowRight')tourShow(tourI+1);if(e.key==='ArrowLeft'&&tourI>0)tourShow(tourI-1)});
save();render();if(!db.guideSeen)setTimeout(tourStart,700);if(cleanedPresets)setTimeout(()=>toast(`已移除 ${cleanedPresets} 道之前自動加入、沒用過的菜`),400);})();
</script></body></html>
